[tool.poetry]
name = "dagon"
version = "0.1.0"
description = ""
authors = ["morv"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
discord-py = "^2.3.2"
python-dotenv = "^1.0"
aiohttp = "^3.9"

[tool.poetry.group.dev.dependencies]
black = "^23.11.0"
isort = "^5.13.2"
pytest = "^9.2.0"
pytest-asyncio = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.isort]
profile = "black"
